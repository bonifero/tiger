name: "Загрузка рюкзака — runtime comparison"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=12,<13' 'pyautogui==0.9.54'
      - name: Walk through original Delphi application
        run: python -X utf8 -u qa/lab3-parity-2026-11-23/original_runtime.py
      - name: Upload runtime observations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lab3-original-runtime
          path: qa/lab3-parity-2026-11-23/runtime-original/
